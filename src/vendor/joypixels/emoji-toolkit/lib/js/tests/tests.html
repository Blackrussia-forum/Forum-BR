<!DOCTYPE html>

        <script>
        
            QUnit.module("toImage");

                });
            
                QUnit.test( "multiline emoji string", function( assert ) {
                    assert.equal(joypixels.unifyUnicode(":dancer:\
:dancer:"), "рџ’ѓ\
рџ’ѓ");

            QUnit.module("shortnameToUnicode");

                    assert.equal(joypixels.shortnameToUnicode("Hello world! рџ„ :smile:"), "Hello world! рџ„ рџ„");
                });
            
                QUnit.test( "shortname at start of sentence with apostrophe", function( assert ) {
                    assert.equal(joypixels.shortnameToUnicode(":snail:'s are cool!"), "рџђЊ's are cool!");
                });
            
                QUnit.test( "shortname shares a colon", function( assert ) {
                    assert.equal(joypixels.shortnameToUnicode(":invalid:snail:"), ":invalidрџђЊ");
                });
            
                QUnit.test( "mixed ascii, regular unicode and duplicate emoji", function( assert ) {
                    assert.equal(joypixels.shortnameToUnicode(":alien: is рџ‘Ѕ and м Ђ is not :alien: or :alien: also :randomy: is not emoji"), "рџ‘Ѕ is рџ‘Ѕ and м Ђ is not рџ‘Ѕ or рџ‘Ѕ also :randomy: is not emoji");

                QUnit.test( "triple emoji string", function( assert ) {
                    assert.equal(joypixels.shortnameToUnicode(":dancer::dancer::alien:"), "рџ’ѓрџ’ѓрџ‘Ѕ");

            QUnit.module("shortnameToImage");

                });
            
                QUnit.test( "shortname at start of sentence with apostrophe", function( assert ) {
                    assert.equal(joypixels.shortnameToImage(":snail:'s are cool!"), "<img class=\"joypixels\" alt=\"рџђЊ\" title=\":snail:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f40c.png\"/>'s are cool!");
                });
            
                QUnit.test( "shortname shares a colon", function( assert ) {
                    assert.equal(joypixels.shortnameToImage(":invalid:snail:"), ":invalid<img class=\"joypixels\" alt=\"рџђЊ\" title=\":snail:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f40c.png\"/>");
                });
            
                QUnit.test( "mixed ascii, regular unicode and duplicate emoji", function( assert ) {
                    assert.equal(joypixels.shortnameToImage(":alien: is рџ‘Ѕ and м Ђ is not :alien: or :alien: also :randomy: is not emoji"), "<img class=\"joypixels\" alt=\"рџ‘Ѕ\" title=\":alien:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f47d.png\"/> is рџ‘Ѕ and м Ђ is not <img class=\"joypixels\" alt=\"рџ‘Ѕ\" title=\":alien:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f47d.png\"/> or <img class=\"joypixels\" alt=\"рџ‘Ѕ\" title=\":alien:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f47d.png\"/> also :randomy: is not emoji");
                });
            
                QUnit.test( "multiline emoji string", function( assert ) {
                    assert.equal(joypixels.shortnameToImage(":dancer:\n:dancer:"), "<img class=\"joypixels\" alt=\"рџ’ѓ\" title=\":dancer:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f483.png\"/>\n<img class=\"joypixels\" alt=\"рџ’ѓ\" title=\":dancer:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f483.png\"/>");
                });
            
                QUnit.test( "triple emoji string", function( assert ) {
                    assert.equal(joypixels.shortnameToImage(":dancer::dancer::alien:"), "<img class=\"joypixels\" alt=\"рџ’ѓ\" title=\":dancer:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f483.png\"/><img class=\"joypixels\" alt=\"рџ’ѓ\" title=\":dancer:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f483.png\"/><img class=\"joypixels\" alt=\"рџ‘Ѕ\" title=\":alien:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f47d.png\"/>");

            QUnit.module("toShort");

                    assert.equal(joypixels.toShort("рџ‘Ѕ is not :alien: and м Ђ is not рџ‘Ѕ or рџ‘Ѕ"), ":alien: is not :alien: and м Ђ is not :alien: or :alien:");
                });

                    assert.equal(joypixels.toShort("рџ’ѓ\nрџ’ѓ"), ":dancer:\n:dancer:");
                });
            
                QUnit.test( "alias vs. canonical", function( assert ) {
                    assert.equal(joypixels.toShort("рџ‡Їрџ‡µ гЃ©гЃ†г‚‚гЃ‚г‚ЉгЃЊгЃЁгЃ†"), ":flag_jp: гЃ©гЃ†г‚‚гЃ‚г‚ЉгЃЊгЃЁгЃ†");

                    assert.equal(joypixels.toShort("<div>рџ„</div>"), "<div>:smile:</div>");

            QUnit.module("toImage");
            
                QUnit.test( "single character shortname conversion", function( assert ) {
                    assert.equal(joypixels.toImage("Hello world! рџ„ :smile:"), "Hello world! <img class=\"joypixels\" alt=\"рџ„\" title=\":smile:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f604.png\"/> <img class=\"joypixels\" alt=\"рџ„\" title=\":smile:\" src=\"https://cdn.jsdelivr.net/joypixels/assets/6.0/png/unicode/64/1f604.png\"/>");
